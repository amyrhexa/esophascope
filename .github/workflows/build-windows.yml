name: Build Windows Executable

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Check required assets
        shell: pwsh
        run: |
          foreach ($file in @('best.onnx', 'app.ico')) {
            if (!(Test-Path $file -PathType Leaf)) {
              throw "Required asset missing: $file"
            }
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nuitka zstandard ordered-set

      - name: Build executable
        shell: pwsh
        run: |
          python -m nuitka `
            --onefile `
            --enable-plugin=pyside6 `
            --include-package=openslide_bin `
            --user-package-configuration-file=.github/nuitka-package.config.yml `
            --include-data-files=best.onnx=best.onnx `
            --include-data-files=app.ico=app.ico `
            --windows-icon-from-ico=app.ico `
            --windows-console-mode=disable `
            --assume-yes-for-downloads `
            --output-dir=dist `
            --output-filename=esophascope.exe `
            esophascope.py

      - name: Smoke-test executable
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist\esophascope.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--help' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Executable smoke test failed: exit code $($process.ExitCode)"
          }

      - uses: actions/upload-artifact@v7
        with:
          name: esophascope-windows-x64
          path: dist/esophascope.exe
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v7
        with:
          name: esophascope-windows-x64
          path: release_assets

      - uses: softprops/action-gh-release@v3
        with:
          files: release_assets/esophascope.exe
          generate_release_notes: false
